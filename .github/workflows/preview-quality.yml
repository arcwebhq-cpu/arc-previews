name: ARC preview quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview-quality:
    name: ARC preview quality/preview-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arcwebhq-cpu/arc-site
          ref: 163f6e2a4c769c779fa23e5c3df1c1008e819a2f
          path: .arc-site-contract
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned ARC site contract dependencies
        run: npm ci --prefix .arc-site-contract
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          ARC_QA_REAL_IMAGES: "1"
          ARC_QA_PLAYWRIGHT_BROWSER: "1"
          ARC_SITE_DIR: .arc-site-contract
      - name: Verify generated artifacts are committed
        run: test -z "$(git status --porcelain --untracked-files=all -- . ':(exclude).arc-site-contract/**')"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-quality-failures
          path: test-results/
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy public preview allowlist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preview-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: arc-previews-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Build strict Pages allowlist
        run: npm run build:pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-dist
          include-hidden-files: true
      - name: Deploy public preview allowlist
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
