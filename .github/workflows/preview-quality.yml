name: ARC preview quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview-quality:
    name: ARC preview quality/preview-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: arcwebhq-cpu/arc-site
          ref: e951ebc9a09ec60de13d47ab65dfa718314f0c8c
          path: .arc-site-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          ARC_QA_REAL_IMAGES: "1"
          ARC_QA_PLAYWRIGHT_BROWSER: "1"
          ARC_SITE_DIR: .arc-site-contract
      - name: Verify generated artifacts are committed
        run: test -z "$(git status --porcelain --untracked-files=all -- . ':(exclude).arc-site-contract/**')"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-quality-failures
          path: test-results/
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy public preview allowlist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preview-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: arc-previews-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build strict Pages allowlist
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist
      - name: Deploy public preview allowlist
        id: deployment
        uses: actions/deploy-pages@v4
