name: ARC preview quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview-quality:
    name: ARC preview quality/preview-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: arcwebhq-cpu/arc-site
          ref: a46628bc47fa2a89daf4bc8dea6cfa66156484a1
          path: .arc-site-contract
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          ARC_QA_REAL_IMAGES: "1"
          ARC_QA_PLAYWRIGHT_BROWSER: "1"
          ARC_SITE_DIR: .arc-site-contract
      - name: Verify generated artifacts are committed
        run: test -z "$(git status --porcelain --untracked-files=all -- . ':(exclude).arc-site-contract/**')"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-quality-failures
          path: test-results/
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy public preview allowlist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preview-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: arc-previews-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Build strict Pages allowlist
        run: npm run build:pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .pages-dist
      - name: Deploy public preview allowlist
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
